<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ইউনিয়ন ভোটার তালিকা</title>
    <meta name="description" content="ইউনিয়ন ভোটার তালিকা ও ভোটার অনুসন্ধান অ্যাপ্লিকেশন">
    <meta property="og:title" content="ইউনিয়ন ভোটার তালিকা">
    <meta property="og:description" content="ইউনিয়ন ভোটার তালিকা ও ভোটার অনুসন্ধান অ্যাপ্লিকেশন">
    <link rel="icon" href="logo.png" type="image/png">
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="logo.png">
    <meta name="theme-color" content="#4f46e5">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #f4f7f6; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 15px; }
        .login-card { background: #ffffff; width: 100%; max-width: 400px; padding: 40px 30px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08); margin: 20px; }
        .header { text-align: center; margin-bottom: 25px; }
        .header img { width: 60px; height: 60px; border-radius: 50%; object-fit: cover; margin-bottom: 10px; }
        .header h2 { color: #333; font-size: 24px; margin-bottom: 5px; }
        .header p { color: #777; font-size: 14px; }
        .status-box { display: none; padding: 12px 14px; border-radius: 10px; font-size: 14px; margin-bottom: 18px; text-align: center; line-height: 1.4; }
        .status-error { background-color: #fee2e2; color: #b91c1c; border: 1px solid #fca5a5; }
        .status-success { background-color: #ecfdf5; color: #047857; border: 1px solid #a7f3d0; }
        .input-group { margin-bottom: 20px; position: relative; }
        .input-group input { width: 100%; padding: 14px 15px; border: 1.5px solid #e1e1e1; border-radius: 10px; font-size: 16px; transition: all 0.3s ease; outline: none; }
        .input-group input:focus { border-color: #1a73e8; box-shadow: 0 0 0 3px rgba(26, 115, 232, 0.1); }
        .password-toggle-btn { position: absolute; right: 12px; top: 50%; transform: translateY(-50%); background: none; border: none; font-size: 18px; cursor: pointer; color: #64748b; padding: 4px 6px; border-radius: 6px; line-height: 1; }
        .password-toggle-btn:hover { background: #f1f5f9; }
        .forgot-pass { text-align: right; margin-top: -10px; margin-bottom: 20px; }
        .forgot-pass a { color: #1a73e8; text-decoration: none; font-size: 14px; font-weight: 500; cursor: pointer; }
        .forgot-pass a:hover { text-decoration: underline; }
        .btn { width: 100%; padding: 14px; border: none; border-radius: 10px; font-size: 16px; font-weight: bold; cursor: pointer; transition: background 0.3s ease; }
        .btn-primary { background-color: #1a73e8; color: white; box-shadow: 0 4px 10px rgba(26, 115, 232, 0.3); }
        .btn-primary:hover { background-color: #1557b0; }
        .btn-primary:disabled { background-color: #94a3b8; cursor: not-allowed; }
    </style>
</head>
<body>

    <div class="login-card">
        <div class="header">
            <img src="logo.png" alt="Logo" onerror="this.style.display='none'">
            <h2>স্বাগতম</h2>
            <p>ইউনিয়ন ভোটার তালিকায় প্রবেশ করুন</p>
        </div>

        <div id="statusBox" class="status-box"></div>

        <div class="input-group">
            <input type="email" id="email" placeholder="আপনার ইমেইল" required autocomplete="email" autocapitalize="none" spellcheck="false">
        </div>
        
        <div class="input-group">
            <input type="password" id="password" placeholder="আপনার পাসওয়ার্ড" required autocomplete="current-password" autocapitalize="none" style="padding-right: 45px;">
            <button type="button" id="togglePasswordBtn" class="password-toggle-btn" title="পাসওয়ার্ড দেখুন/লুকান">👁️</button>
        </div>

        <div class="forgot-pass">
            <a id="resetPasswordBtn">পাসওয়ার্ড ভুলে গেছেন?</a>
        </div>

        <button class="btn btn-primary" id="emailLoginBtn">লগইন করুন</button>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, sendPasswordResetEmail, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

        // ফায়ারবেস কনফিগারেশন
        const firebaseConfig = {
            apiKey: "AIzaSyDSE5kxWXULnlTB2sOY7AE6MLFLmHuguWg",
            authDomain: "voter-apps-14962.firebaseapp.com",
            projectId: "voter-apps-14962",
            storageBucket: "voter-apps-14962.firebasestorage.app",
            messagingSenderId: "957567395353",
            appId: "1:957567395353:android:84aad0acdb14a8a343ec88"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        // লগআউট করে আসলে যেন পুনরায় অটো-রিডাইরেক্ট না হয়
        const urlParams = new URLSearchParams(window.location.search);
        const loggedOutParam = urlParams.get('logged_out');
        const isLoggedOut = loggedOutParam === '1' || loggedOutParam === 'another_device' || sessionStorage.getItem('logged_out') === '1';

        if (isLoggedOut) {
            sessionStorage.removeItem('logged_out');
            localStorage.removeItem('voter_device_session_id');
            signOut(auth).catch(() => {});
            window.history.replaceState({}, document.title, window.location.pathname);
            if (loggedOutParam === 'another_device') {
                setTimeout(() => {
                    showMessage("⚠️ আপনার অ্যাকাউন্টটি অন্য একটি মোবাইলে লগইন করা হয়েছে! এক সাথে কেবল একটি মোবাইলেই ব্যবহার করা যাবে, তাই এই ডিভাইসটি স্বয়ংক্রিয়ভাবে লগআউট করা হয়েছে।", true);
                }, 100);
            }
        } else {
            // যদি ইতিমধ্যে লগইন করা থাকে তবে সরাসরি সার্চ পেজে চলে যাবে
            onAuthStateChanged(auth, (user) => {
                if (user) {
                    window.location.replace("search.html");
                }
            });
        }

        const emailInput = document.getElementById('email');
        const passwordInput = document.getElementById('password');
        const togglePasswordBtn = document.getElementById('togglePasswordBtn');
        const statusBox = document.getElementById('statusBox');
        const loginBtn = document.getElementById('emailLoginBtn');

        // পাসওয়ার্ড দেখা/লুকানোর বাটন
        if (togglePasswordBtn) {
            togglePasswordBtn.addEventListener('click', () => {
                if (passwordInput.type === 'password') {
                    passwordInput.type = 'text';
                    togglePasswordBtn.innerText = '🙈';
                } else {
                    passwordInput.type = 'password';
                    togglePasswordBtn.innerText = '👁️';
                }
            });
        }

        // Enter কী চাপলে দ্রুত লগইন
        emailInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                passwordInput.focus();
            }
        });
        passwordInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                loginBtn.click();
            }
        });

        function showMessage(msg, isError = true) {
            statusBox.innerText = msg;
            statusBox.className = 'status-box ' + (isError ? 'status-error' : 'status-success');
            statusBox.style.display = 'block';
        }
        
        // ১. ইমেইল ও পাসওয়ার্ড দিয়ে লগইন
        loginBtn.addEventListener('click', () => {
            // অতিরিক্ত স্পেস ও কেস সেনসিটিভিটি হ্যান্ডলিং
            const email = emailInput.value.trim().toLowerCase();
            const password = passwordInput.value.trim();
            
            if (!email || !password) {
                showMessage("দয়া করে ইমেইল এবং পাসওয়ার্ড দিন!", true);
                return;
            }

            loginBtn.disabled = true;
            loginBtn.innerText = "লগইন করা হচ্ছে...";
            showMessage("লগইন করা হচ্ছে...", false);

            signInWithEmailAndPassword(auth, email, password)
                .then(async (userCredential) => {
                    // এক ডিভাইসে এক সেশন - সেশন আইডি তৈরি ও সার্ভারে রেজিস্টার
                    const newSessionId = 'sess_' + Date.now() + '_' + Math.random().toString(36).substring(2, 10);
                    localStorage.setItem('voter_device_session_id', newSessionId);
                    try {
                        await fetch('/api/session/register', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ email: userCredential.user.email, sessionId: newSessionId })
                        });
                    } catch (e) {
                        console.warn("Session register sync notice:", e.message);
                    }
                    // সরাসরি সার্চ পেজে প্রবেশ
                    window.location.replace("search.html"); 
                })
                .catch((error) => {
                    console.warn("Login result code:", error.code);
                    loginBtn.disabled = false;
                    loginBtn.innerText = "লগইন করুন";

                    let errMsg = "লগইন ব্যর্থ হয়েছে। ইমেইল বা পাসওয়ার্ড সঠিক নয়।";
                    if (error.code === 'auth/unauthorized-domain') {
                        errMsg = "ফায়ারবেসে এই ডোমেনটি অনুমোদন দেওয়া নেই (" + window.location.hostname + ")।";
                    } else if (error.code === 'auth/invalid-credential' || error.code === 'auth/user-not-found' || error.code === 'auth/wrong-password') {
                        errMsg = "ইমেইল বা পাসওয়ার্ড সঠিক নয়। অনুগ্রহ করে পুনরায় সতর্কতার সাথে টাইপ করুন (বড়/ছোট হাতের অক্ষর ও বাড়তি স্পেস খেয়াল করুন)।";
                    } else if (error.code === 'auth/invalid-email') {
                        errMsg = "ইমেইলের ফরম্যাট সঠিক নয়। যেমন: user@gmail.com";
                    } else if (error.code === 'auth/too-many-requests') {
                        errMsg = "বারবার ভুল পাসওয়ার্ড দেওয়ার কারণে অ্যাকাউন্টটি সাময়িকভাবে বন্ধ আছে। কিছুক্ষণ পর আবার চেষ্টা করুন।";
                    } else if (error.code === 'auth/network-request-failed') {
                        errMsg = "ইন্টারনেট সংযোগে সমস্যা দেখা দিয়েছে। ইন্টারনেট চেক করে আবার চেষ্টা করুন।";
                    }
                    showMessage(errMsg, true);
                });
        });

        // ২. পাসওয়ার্ড রিসেট
        document.getElementById('resetPasswordBtn').addEventListener('click', (e) => {
            e.preventDefault();
            const email = emailInput.value.trim();
            
            if(!email) {
                showMessage("পাসওয়ার্ড রিসেট করতে আগে উপরের বক্সে আপনার ইমেইলটি লিখুন!", true);
                return;
            }

            showMessage("রিসেট লিংক পাঠানো হচ্ছে...", false);

            sendPasswordResetEmail(auth, email)
                .then(() => {
                    showMessage("আপনার ইমেইলে পাসওয়ার্ড রিসেট লিংক পাঠানো হয়েছে।", false);
                })
                .catch((error) => {
                    showMessage("ইমেইলটি সঠিক নয় অথবা অ্যাকাউন্টটি সিস্টেমে নেই।", true);
                });
        });
    </script>
</body>
</html>
