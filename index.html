<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>লগইন প্যানেল</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #f4f7f6;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .login-card {
            background: #ffffff;
            width: 100%;
            max-width: 400px;
            padding: 40px 30px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
            margin: 20px;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .header h2 {
            color: #333;
            font-size: 24px;
            margin-bottom: 5px;
        }

        .header p {
            color: #777;
            font-size: 14px;
        }

        .input-group {
            margin-bottom: 20px;
        }

        .input-group input {
            width: 100%;
            padding: 14px 15px;
            border: 1.5px solid #e1e1e1;
            border-radius: 10px;
            font-size: 16px;
            transition: all 0.3s ease;
            outline: none;
        }

        .input-group input:focus {
            border-color: #1a73e8;
            box-shadow: 0 0 0 3px rgba(26, 115, 232, 0.1);
        }

        .forgot-pass {
            text-align: right;
            margin-top: -10px;
            margin-bottom: 20px;
        }

        .forgot-pass a {
            color: #1a73e8;
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
        }

        .forgot-pass a:hover {
            text-decoration: underline;
        }

        .btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s ease;
        }

        .btn-primary {
            background-color: #1a73e8;
            color: white;
            box-shadow: 0 4px 10px rgba(26, 115, 232, 0.3);
        }

        .btn-primary:hover {
            background-color: #1557b0;
        }

        .divider {
            display: flex;
            align-items: center;
            text-align: center;
            margin: 25px 0;
            color: #999;
            font-size: 14px;
        }

        .divider::before, .divider::after {
            content: '';
            flex: 1;
            border-bottom: 1px solid #eee;
        }

        .divider span {
            padding: 0 10px;
        }

        .btn-google {
            background-color: white;
            color: #444;
            border: 1px solid #ddd;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
        }

        .btn-google:hover {
            background-color: #f8f9fa;
        }

        .btn-google img {
            width: 20px;
        }

        .signup-link {
            text-align: center;
            margin-top: 25px;
            font-size: 14px;
            color: #555;
        }

        .signup-link a {
            color: #1a73e8;
            text-decoration: none;
            font-weight: bold;
        }

        .signup-link a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div class="login-card">
        <div class="header">
            <h2>স্বাগতম</h2>
            <p>আপনার অ্যাকাউন্টে লগইন করুন</p>
        </div>

        <div class="input-group">
            <input type="email" id="email" placeholder="আপনার ইমেইল" required>
        </div>
        
        <div class="input-group">
            <input type="password" id="password" placeholder="আপনার পাসওয়ার্ড" required>
        </div>

        <div class="forgot-pass">
            <!-- পাসওয়ার্ড রিসেট লিংকে ক্লিক করলে ফায়ারবেস পাসওয়ার্ড রিসেট ফাংশন কল করতে হবে -->
            <a href="#" id="resetPasswordBtn">পাসওয়ার্ড ভুলে গেছেন?</a>
        </div>

        <!-- ইমেইল-পাসওয়ার্ড দিয়ে লগইন করার বাটন -->
        <button class="btn btn-primary" id="emailLoginBtn">লগইন করুন</button>

        <div class="divider">
            <span>অথবা</span>
        </div>

        <!-- গুগল লগইন বাটন -->
        <button class="btn btn-google" id="googleLoginBtn">
            <img src="https://upload.wikimedia.org/wikipedia/commons/5/53/Google_%22G%22_Logo.svg" alt="Google Logo">
            Google দিয়ে লগইন করুন
        </button>

        <div class="signup-link">
            অ্যাকাউন্ট নেই? <a href="#" id="createAccountBtn">নতুন অ্যাকাউন্ট খুলুন</a>
        </div>
    </div>

    <!-- নিচে আপনার Firebase-এর জাভাস্ক্রিপ্ট কোডগুলো যুক্ত করবেন -->
    <script>
        // এখানে আপনার Firebase কনফিগারেশন এবং লগইন, গুগল লগইন, পাসওয়ার্ড রিসেটের জাভাস্ক্রিপ্ট কোডগুলো বসবে।
        // বাটনগুলোর ID (যেমন: emailLoginBtn, googleLoginBtn, resetPasswordBtn) ব্যবহার করে ইভেন্ট লিসেনার অ্যাড করবেন।
    </script>

</body>
</html>
