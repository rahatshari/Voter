<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>লগইন প্যানেল</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #f4f7f6; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .login-card { background: #ffffff; width: 100%; max-width: 400px; padding: 40px 30px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08); margin: 20px; }
        .header { text-align: center; margin-bottom: 30px; }
        .header h2 { color: #333; font-size: 24px; margin-bottom: 5px; }
        .header p { color: #777; font-size: 14px; }
        .input-group { margin-bottom: 20px; }
        .input-group input { width: 100%; padding: 14px 15px; border: 1.5px solid #e1e1e1; border-radius: 10px; font-size: 16px; transition: all 0.3s ease; outline: none; }
        .input-group input:focus { border-color: #1a73e8; box-shadow: 0 0 0 3px rgba(26, 115, 232, 0.1); }
        .forgot-pass { text-align: right; margin-top: -10px; margin-bottom: 20px; }
        .forgot-pass a { color: #1a73e8; text-decoration: none; font-size: 14px; font-weight: 500; cursor: pointer; }
        .forgot-pass a:hover { text-decoration: underline; }
        .btn { width: 100%; padding: 14px; border: none; border-radius: 10px; font-size: 16px; font-weight: bold; cursor: pointer; transition: background 0.3s ease; }
        .btn-primary { background-color: #1a73e8; color: white; box-shadow: 0 4px 10px rgba(26, 115, 232, 0.3); margin-bottom: 15px;}
        .btn-primary:hover { background-color: #1557b0; }
    </style>
</head>
<body>

    <div class="login-card">
        <div class="header">
            <h2>স্বাগতম</h2>
            <p>আপনার অ্যাকাউন্টে লগইন করুন</p>
        </div>

        <div class="input-group">
            <input type="email" id="email" placeholder="আপনার ইমেইল" required>
        </div>
        
        <div class="input-group">
            <input type="password" id="password" placeholder="আপনার পাসওয়ার্ড" required>
        </div>

        <div class="forgot-pass">
            <a id="resetPasswordBtn">পাসওয়ার্ড ভুলে গেছেন?</a>
        </div>

        <button class="btn btn-primary" id="emailLoginBtn">লগইন করুন</button>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, sendPasswordResetEmail } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

        // ফায়ারবেস কনফিগারেশন
        const firebaseConfig = {
            apiKey: "AIzaSyDSE5kxWXULnlTB2sOY7AE6MLFLmHuguWg",
            authDomain: "voter-apps-14962.firebaseapp.com",
            projectId: "voter-apps-14962",
            storageBucket: "voter-apps-14962.firebasestorage.app",
            messagingSenderId: "957567395353",
            appId: "1:957567395353:android:84aad0acdb14a8a343ec88"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        const emailInput = document.getElementById('email');
        const passwordInput = document.getElementById('password');
        
        // ১. ইমেইল ও পাসওয়ার্ড দিয়ে লগইন
        document.getElementById('emailLoginBtn').addEventListener('click', () => {
            const email = emailInput.value;
            const password = passwordInput.value;
            
            if(!email || !password) {
                alert("দয়া করে ইমেইল এবং পাসওয়ার্ড দিন!");
                return;
            }

            signInWithEmailAndPassword(auth, email, password)
                .then((userCredential) => {
                    // পপআপ মেসেজ বাদ দিয়ে সরাসরি পরবর্তী পেজে প্রবেশ
                    window.location.href = "search.html"; 
                })
                .catch((error) => {
                    alert("লগইন ব্যর্থ হয়েছে। ইমেইল বা পাসওয়ার্ড ভুল হতে পারে।");
                });
        });

        // ২. পাসওয়ার্ড রিসেট
        document.getElementById('resetPasswordBtn').addEventListener('click', (e) => {
            e.preventDefault();
            const email = emailInput.value;
            
            if(!email) {
                alert("পাসওয়ার্ড রিসেট করতে আগে উপরের বক্সে আপনার ইমেইলটি লিখুন!");
                return;
            }

            sendPasswordResetEmail(auth, email)
                .then(() => {
                    alert("আপনার ইমেইলে পাসওয়ার্ড রিসেট লিংক পাঠানো হয়েছে।");
                })
                .catch((error) => {
                    alert("ইমেইলটি সঠিক নয় অথবা অ্যাকাউন্টটি সিস্টেমে নেই।");
                });
        });
    </script>
</body>
</html>
